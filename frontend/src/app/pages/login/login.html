<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <img src="assets/logo.png" alt="Ecocable Logo" class="login-logo" />
      <h1 class="login-title">Tiempo Extra</h1>
      <p class="login-subtitle">Ecocable México Corporation</p>
    </div>

    @if (mensaje) {
      <div class="alert alert-{{ tipoMensaje }} text-center py-2" role="alert">
        {{ mensaje }}
      </div>
    }

    <form (ngSubmit)="onLogin()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="username">Usuario</label>
        <div class="input-group">
          <span class="input-group-text">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input
            type="text"
            id="username"
            class="form-control"
            [(ngModel)]="username"
            name="username"
            autocomplete="username"
            placeholder="Nombre de usuario"
            autofocus
          />
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="password">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input
            [type]="mostrarPassword ? 'text' : 'password'"
            id="password"
            class="form-control"
            [(ngModel)]="password"
            name="password"
            autocomplete="current-password"
            placeholder="Contraseña"
          />
          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="mostrarPassword = !mostrarPassword"
            [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            tabindex="-1"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-lg login-btn" [disabled]="cargando">
        @if (cargando) {
          <span class="spinner-border spinner-border-sm me-2" role="status"></span>
          Ingresando...
        } @else {
          Iniciar Sesión
        }
      </button>
    </form>

    <div class="login-footer">
      <small>&copy; {{ currentYear }} Ecocable México Corporation</small>
    </div>
  </div>
</div>
